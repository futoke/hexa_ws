# config/lifecycle_mgr.yaml
#
# Example configuration file to automatically handle the ldlidar lifecycle node

/**:
  ros__parameters:
    autostart: True
    node_names: ['ldlidar_node']  #, 'map_server', 'amcl', 'planner_server', 'controller_server', 'recoveries_server', 'bt_navigator', 'waypoint_follower']
    bond_timeout: 5.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0